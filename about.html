<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solis Bistro | Cafe & Kitchen Addis</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        warm_wood: '#2C1B18',
                        clay: '#D97706',
                    },
                    fontFamily: {
                        display: [ 'Cormorant Garamond', 'serif' ],
                        sans: [ 'Inter', 'sans-serif' ],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-[#FCFAFA] font-sans text-warm_wood">
    <nav
        class="fixed w-full z-50 bg-[#FCFAFA]/90 backdrop-blur-md py-6 px-10 flex justify-between items-center border-b border-gray-100">
        <div class="text-2xl font-display font-bold italic tracking-tight">Solis <span class="text-clay">Bistro.</span>
        </div>
        <div class="hidden md:flex space-x-10 text-[11px] uppercase tracking-[0.2em] font-semibold text-gray-500">
            <a href="index.html" class="hover:text-clay transition">Home</a>
            <a href="menu.html"
                class="hover:text-clay transition border-b border-transparent hover:border-clay">Menu</a>
            <a href="about.html" class="hover:text-clay transition border-b border-transparent hover:border-clay">Our
                Story</a>
            <a href="contact.html"
                class="hover:text-clay transition border-b border-transparent hover:border-clay">Visit</a>
        </div>
        <a href="tel:+251911223344"
            class="border border-warm_wood px-6 py-2 text-[10px] uppercase tracking-widest hover:bg-warm_wood hover:text-white transition">Call
            Table</a>
    </nav>

    <section class="py-32 px-6 max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
        <div>
            <h2 class="font-display text-5xl italic mb-8">A Taste of Tradition, <br>Refined.</h2>
            <p class="text-gray-600 leading-relaxed mb-6 font-light">
                Founded in the heart of Addis, Solis Bistro was born from a passion for the perfect roast and the
                communal spirit of the Ethiopian table.
            </p>
            <p class="text-gray-600 leading-relaxed font-light italic">
                "We don't just serve food; we curate moments."
            </p>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <img src="https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&q=80"
                class="rounded-sm shadow-xl mt-8" alt="Interior 1">
            <img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&q=80"
                class="rounded-sm shadow-xl" alt="Coffee">
        </div>
    </section>


</body>

</html>
